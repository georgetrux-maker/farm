<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F6F1EB" />
    <meta name="description" content="Từ một tấm ảnh sản phẩm thành video review có người mẫu, lời thoại và phụ đề." />
    <title>Aura – Video review thời trang bằng AI</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Cả hai font đều có đủ dấu tiếng Việt -->
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,600&display=swap" rel="stylesheet">
    <script>
      // Áp giao diện đã lưu trước khi vẽ trang để không bị nháy màu
      try {
        if (localStorage.getItem('aura_theme') === 'dark') document.documentElement.classList.add('dark')
        if (localStorage.getItem('aura_palette') === 'violet') document.documentElement.dataset.palette = 'violet'
      } catch (e) {}
    </script>
  </head>
  <body class="antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
